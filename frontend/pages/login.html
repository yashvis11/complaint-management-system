<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="login.html">
                📋 ComplaintMS
            </a>

        </div>
    </nav>


    <!-- Login Section -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">

                            <h1 class="h3 mb-2">
                                Welcome Back
                            </h1>

                            <p class="text-muted mb-0">
                                Login to your ComplaintMS account.
                            </p>

                        </div>


                        <!-- Error / Success Message -->
                        <div
                            id="loginMessage"
                            class="alert d-none"
                            role="alert">
                        </div>


                        <!-- Login Form -->
                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Login Button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Login

                            </button>

                        </form>


                        <!-- Register -->
                        <div class="text-center mt-4">

                            <p class="text-muted mb-0">

                                Don't have an account?

                                <a
                                    href="register.html"
                                    class="text-primary text-decoration-none fw-semibold">
                                    Register
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Login JavaScript -->
    <script src="../js/login.js"></script>

</body>

</html>
