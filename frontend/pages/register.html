<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="register.html">
                📋 ComplaintMS
            </a>

        </div>
    </nav>


    <!-- Register Section -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">

                            <h1 class="h3 mb-2">
                                Register
                            </h1>
                        </div>


                        <!-- Error / Success Message -->
                        <div
                            id="registerMessage"
                            class="alert d-none"
                            role="alert">
                        </div>


                        <!-- Register Form -->
                        <form id="registerForm">

                            <!-- Name -->
                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- Email -->
                            <div class="mb-4">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                            <!-- Password -->
                            <div class="mb-4">

                                <label
                                    for="email"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Register Button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Create Account

                            </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <!-- Register JavaScript -->
    <script src="../js/register.js"></script>

</body>

</html>
