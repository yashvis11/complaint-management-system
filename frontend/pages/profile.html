<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        /* Grey out fields that are not editable */
        .form-control[readonly] {
            background-color: #e9ecef;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 560px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">My Profile</h1>
            <a href="complaints.html" class="btn btn-outline-secondary btn-sm">Back to complaints</a>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none"></div>
        <div id="successMessage" class="alert alert-success d-none"></div>
        <div id="loadingMessage" class="text-muted">Loading profile...</div>

        <form id="profileForm" class="card card-body shadow-sm d-none" novalidate>

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" readonly>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" readonly>
            </div>

            <!-- <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <input type="text" id="role" class="form-control" readonly>
            </div> -->

            <div class="mb-4">
                <label for="createdAt" class="form-label">Member since</label>
                <input type="text" id="createdAt" class="form-control" readonly>
            </div>

            <!-- Shown when NOT editing -->
            <div id="viewButtons">
                <button type="button" id="editButton" class="btn btn-primary">Update Profile</button>
            </div>

            <!-- Shown only while editing -->
            <div id="editButtons" class="d-none">
                <button type="submit" id="saveButton" class="btn btn-success">Save changes</button>
                <button type="button" id="cancelButton" class="btn btn-outline-secondary ms-2">Cancel</button>
            </div>

        </form>

    </div>

    <script src="../js/profile.js"></script>
</body>
</html>
