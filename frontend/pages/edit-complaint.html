<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Complaint - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <nav class="navbar navbar-light bg-white border-bottom">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">

                📋 ComplaintMS

            </a>

            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">

                    Dashboard

                </a>

                <a href="complaints.html" class="btn btn-outline-secondary">

                    Complaints

                </a>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="mb-2">
                            Edit Complaint
                        </h2>

                        <p class="text-muted mb-4">
                            Update the details of your complaint.
                        </p>


                        <div id="message" class="alert d-none" role="alert">
                        </div>


                        <form id="editComplaintForm">


                            <div class="mb-3">

                                <label for="title" class="form-label">

                                    Complaint Title

                                </label>

                                <input type="text" id="title" class="form-control" required>

                            </div>


                            <div class="mb-3">

                                <label for="description" class="form-label">

                                    Description

                                </label>

                                <textarea id="description" class="form-control" rows="5" required></textarea>

                            </div>


                            <div class="row">


                                <div class="col-md-6 mb-3">

                                    <label for="category" class="form-label">

                                        Category

                                    </label>

                                    <select id="category" class="form-select" required>

                                        <option value="Network">
                                            Network
                                        </option>

                                        <option value="Hardware">
                                            Hardware
                                        </option>

                                        <option value="Software">
                                            Software
                                        </option>

                                        <option value="Facilities">
                                            Facilities
                                        </option>

                                        <option value="Administration">
                                            Administration
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="priority" class="form-label">

                                        Priority

                                    </label>

                                    <select id="priority" class="form-select" required>

                                        <option value="Low">
                                            Low
                                        </option>

                                        <option value="Medium">
                                            Medium
                                        </option>

                                        <option value="High">
                                            High
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <div class="d-flex gap-2 mt-4">

                                <button type="submit" class="btn btn-primary" id="saveBtn">

                                    Save Changes

                                </button>


                                <a href="complaints.html" class="btn btn-outline-secondary">

                                    Cancel

                                </a>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script>

        const complaintId =
            new URLSearchParams(window.location.search).get("id");

        const form =
            document.getElementById("editComplaintForm");

        const message =
            document.getElementById("message");

        const saveBtn =
            document.getElementById("saveBtn");


        async function loadComplaint() {

            try {

                if (!complaintId) {

                    throw new Error("Complaint ID is missing");

                }


                const response = await fetch(
                    `/api/complaints/${complaintId}`
                );

                const result = await response.json();


                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||
                        "Failed to load complaint"
                    );

                }


                const complaint = result.data;


                document.getElementById("title").value =
                    complaint.title || "";

                document.getElementById("description").value =
                    complaint.description || "";

                document.getElementById("category").value =
                    complaint.category || "";

                document.getElementById("priority").value =
                    complaint.priority || "";


            } catch (error) {

                console.error(error);

                message.className =
                    "alert alert-danger";

                message.textContent =
                    error.message;

            }

        }


        form.addEventListener("submit", async function (event) {

            event.preventDefault();


            saveBtn.disabled = true;

            saveBtn.textContent = "Saving...";


            const complaintData = {

                title:
                    document.getElementById("title").value.trim(),

                description:
                    document.getElementById("description").value.trim(),

                category:
                    document.getElementById("category").value,

                priority:
                    document.getElementById("priority").value

            };


            try {

                const response = await fetch(
                    `/api/complaints/${complaintId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(complaintData)
                    }
                );


                const result =
                    await response.json();


                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||
                        "Failed to update complaint"
                    );

                }


                message.className =
                    "alert alert-success";

                message.textContent =
                    "Complaint updated successfully!";


                setTimeout(() => {

                    window.location.href =
                        `complaint-details.html?id=${complaintId}`;

                }, 1000);


            } catch (error) {

                console.error(error);

                message.className =
                    "alert alert-danger";

                message.textContent =
                    error.message;

            }


            saveBtn.disabled = false;

            saveBtn.textContent =
                "Save Changes";

        });


        loadComplaint();

    </script>

</body>

</html>
