<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Complaint - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
                📋 ComplaintMS
            </a>

            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">
                    Dashboard
                </a>

                <a href="complaints.html" class="btn btn-outline-secondary">
                    My Complaints
                </a>

                <a href="profile.html" class="btn btn-outline-secondary">
                    Profile
                </a>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Page Header -->
                <div class="mb-4">

                    <a
                        href="complaints.html"
                        class="btn btn-outline-secondary mb-3"
                    >
                        ← Back to Complaints
                    </a>

                    <h1 class="mb-2">
                        Edit Complaint
                    </h1>

                    <p class="text-muted mb-0">
                        Update the details of your pending complaint.
                    </p>

                </div>


                <!-- Loading Message -->
                <div
                    id="loadingMessage"
                    class="text-center py-5"
                >

                    <div
                        class="spinner-border text-primary"
                        role="status"
                    >
                        <span class="visually-hidden">
                            Loading...
                        </span>
                    </div>

                    <p class="text-muted mt-3 mb-0">
                        Loading complaint...
                    </p>

                </div>


                <!-- Error Message -->
                <div
                    id="errorMessage"
                    class="alert alert-danger d-none"
                    role="alert"
                ></div>


                <!-- Edit Form -->
                <div
                    id="editFormContainer"
                    class="card shadow-sm border-0 d-none"
                >

                    <div class="card-body p-4">

                        <form id="editComplaintForm">

                            <!-- Complaint ID -->
                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Complaint ID
                                </label>

                                <input
                                    type="text"
                                    id="complaintId"
                                    class="form-control"
                                    readonly
                                >

                            </div>


                            <!-- Title -->
                            <div class="mb-4">

                                <label
                                    for="title"
                                    class="form-label fw-semibold"
                                >
                                    Complaint Title
                                </label>

                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Enter complaint title"
                                    required
                                >

                            </div>


                            <!-- Description -->
                            <div class="mb-4">

                                <label
                                    for="description"
                                    class="form-label fw-semibold"
                                >
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Describe your complaint"
                                    required
                                ></textarea>

                            </div>


                            <!-- Category -->
                            <div class="mb-4">

                                <label
                                    for="category"
                                    class="form-label fw-semibold"
                                >
                                    Category
                                </label>

                                <select
                                    id="category"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select a category
                                    </option>

                                    <option value="Academic">
                                        Academic
                                    </option>

                                    <option value="Infrastructure">
                                        Infrastructure
                                    </option>

                                    <option value="Hostel">
                                        Hostel
                                    </option>

                                    <option value="Transport">
                                        Transport
                                    </option>

                                    <option value="Library">
                                        Library
                                    </option>

                                    <option value="Canteen">
                                        Canteen
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- Priority -->
                            <div class="mb-4">

                                <label
                                    for="priority"
                                    class="form-label fw-semibold"
                                >
                                    Priority
                                </label>

                                <select
                                    id="priority"
                                    class="form-select"
                                    required
                                >

                                    <option value="Low">
                                        Low
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                </select>

                            </div>


                            <!-- Current Status -->
                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Current Status
                                </label>

                                <div>
                                    <span
                                        id="statusBadge"
                                        class="badge"
                                    ></span>
                                </div>

                                <div class="form-text">
                                    Only pending complaints can be edited.
                                </div>

                            </div>


                            <!-- Error Message -->
                            <div
                                id="formErrorMessage"
                                class="alert alert-danger d-none"
                                role="alert"
                            ></div>


                            <!-- Success Message -->
                            <div
                                id="successMessage"
                                class="alert alert-success d-none"
                                role="alert"
                            ></div>


                            <!-- Buttons -->
                            <div class="d-flex justify-content-end gap-2">

                                <a
                                    href="complaints.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                                <button
                                    type="submit"
                                    id="saveButton"
                                    class="btn btn-primary"
                                >
                                    Save Changes
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Edit Complaint JavaScript -->
    <script src="../js/edit-complaint.js"></script>

</body>

</html>
