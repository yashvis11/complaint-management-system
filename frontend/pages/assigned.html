<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assigned to Me - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <style>
        #assignedRows tr { cursor: pointer; }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
                📋 ComplaintMS
            </a>

            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">
                    Dashboard
                </a>

                <a href="complaints.html" class="btn btn-outline-secondary">
                    My Complaints
                </a>

                <a href="profile.html" class="btn btn-outline-secondary">
                    Profile
                </a>

            </div>

        </div>
    </nav>


    <main class="container py-5">

        <div class="mb-4">
            <h1 class="mb-2">Assigned to Me</h1>
            <p class="text-muted mb-0">
                Complaints the admin has assigned to you. Click one to see its details.
            </p>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <div class="row g-4">

            <!-- List -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>From</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="assignedRows">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        Loading...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Details -->
            <div class="col-lg-5">
                <div class="card card-body shadow-sm border-0">

                    <p id="detailEmpty" class="text-muted mb-0">
                        Select a complaint to see its details.
                    </p>

                    <div id="detailPanel" class="d-none">

                        <h2 class="h5" id="detailTitle"></h2>
                        <p class="text-muted small" id="detailMeta"></p>

                        <div
                            id="detailDescription"
                            class="bg-light rounded p-3 mb-3"
                            style="white-space: pre-wrap;"
                        ></div>

                        <img
                            id="detailImage"
                            class="img-fluid rounded border d-none"
                            style="max-height: 300px;"
                            alt="Complaint photo"
                        >

                    </div>

                </div>
            </div>

        </div>

    </main>

    <script src="../js/assigned.js"></script>

</body>

</html>
