<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Complaint - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
                📋 ComplaintMS
            </a>

            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">
                    Dashboard
                </a>

                <a href="complaints.html" class="btn btn-outline-secondary">
                    Complaints
                </a>

                <a href="profile.html" class="btn btn-outline-secondary">
                    Profile
                </a>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="mb-2">
                            Create New Complaint
                        </h2>

                        <p class="text-muted mb-4">
                            Submit a new complaint to the Complaint Management System.
                        </p>


                        <!-- Success / Error Message -->
                        <div id="message" class="alert d-none" role="alert">
                        </div>


                        <!-- Complaint Form -->
                        <form id="complaintForm">

                            <!-- Title -->
                            <div class="mb-3">

                                <label for="title" class="form-label">
                                    Complaint Title
                                </label>

                                <input type="text" id="title" name="title" class="form-control"
                                    placeholder="Enter complaint title" required>

                            </div>


                            <!-- Description -->
                            <div class="mb-3">

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <textarea id="description" name="description" class="form-control" rows="5"
                                    placeholder="Describe your complaint" required></textarea>

                            </div>


                            <div class="row">

                                <!-- Category -->
                                <div class="col-md-6 mb-3">

                                    <label for="category" class="form-label">
                                        Category
                                    </label>

                                    <select id="category" name="category" class="form-select" required>

                                        <option value="">
                                            Select Category
                                        </option>

                                        <option value="Network">
                                            Network
                                        </option>

                                        <option value="Hardware">
                                            Hardware
                                        </option>

                                        <option value="Software">
                                            Software
                                        </option>

                                        <option value="Facilities">
                                            Facilities
                                        </option>

                                        <option value="Administration">
                                            Administration
                                        </option>

                                    </select>

                                </div>


                                <!-- Priority -->
                                <div class="col-md-6 mb-3">

                                    <label for="priority" class="form-label">
                                        Priority
                                    </label>

                                    <select id="priority" name="priority" class="form-select" required>

                                        <option value="">
                                            Select Priority
                                        </option>

                                        <option value="Low">
                                            Low
                                        </option>

                                        <option value="Medium">
                                            Medium
                                        </option>

                                        <option value="High">
                                            High
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- Submit -->
                            <div class="d-flex gap-2 mt-4">

                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    Submit Complaint
                                </button>

                                <button type="reset" class="btn btn-outline-secondary">
                                    Clear
                                </button>

                                <a href="complaints.html" class="btn btn-outline-dark">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script>

        const API_BASE_URL = window.location.origin;

        const form = document.getElementById("complaintForm");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            message.className = "alert d-none";
            message.textContent = "";


            const complaintData = {
                user_id: 2,

                title: document.getElementById("title").value.trim(),

                description:
                    document.getElementById("description").value.trim(),

                category:
                    document.getElementById("category").value,

                priority:
                    document.getElementById("priority").value
            };


            try {

                const response = await fetch(
                    `${API_BASE_URL}/api/complaints`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(complaintData)
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message || "Failed to create complaint"
                    );

                }


                message.className = "alert alert-success";
                message.textContent =
                    "Complaint submitted successfully!";


                form.reset();


                setTimeout(() => {

                    window.location.href = "complaints.html";

                }, 1500);


            } catch (error) {

                console.error(error);

                message.className = "alert alert-danger";

                message.textContent =
                    error.message ||
                    "Unable to submit complaint.";

            }


            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Complaint";

        });

    </script>

</body>

</html>
