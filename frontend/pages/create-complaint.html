<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Complaint - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
                📋 ComplaintMS
            </a>

            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">
                    Dashboard
                </a>

                <a href="complaints.html" class="btn btn-outline-secondary">
                    My Complaints
                </a>

                <a href="profile.html" class="btn btn-outline-secondary">
                    Profile
                </a>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Page Header -->
                <div class="mb-4">

                    <h1 class="mb-2">
                        Create New Complaint
                    </h1>

                    <p class="text-muted mb-0">
                        Submit a complaint and provide the details below.
                    </p>

                </div>


                <!-- Complaint Form -->
                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <form id="complaintForm">

                            <!-- Title -->
                            <div class="mb-4">

                                <label for="title" class="form-label fw-semibold">
                                    Complaint Title
                                </label>

                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Enter complaint title"
                                    required
                                >

                            </div>


                            <!-- Description -->
                            <div class="mb-4">

                                <label for="description" class="form-label fw-semibold">
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Describe your complaint in detail"
                                    required
                                ></textarea>

                            </div>


                            <!-- Category -->
                            <div class="mb-4">

                                <label for="category" class="form-label fw-semibold">
                                    Category
                                </label>

                                <select
                                    id="category"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select a category
                                    </option>

                                    <option value="Academic">
                                        Academic
                                    </option>

                                    <option value="Infrastructure">
                                        Infrastructure
                                    </option>

                                    <option value="Hostel">
                                        Hostel
                                    </option>

                                    <option value="Transport">
                                        Transport
                                    </option>

                                    <option value="Library">
                                        Library
                                    </option>

                                    <option value="Canteen">
                                        Canteen
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- Priority -->
                            <div class="mb-4">

                                <label for="priority" class="form-label fw-semibold">
                                    Priority
                                </label>

                                <select
                                    id="priority"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select priority
                                    </option>

                                    <option value="Low">
                                        Low
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                </select>

                            </div>


                            <!-- Error Message -->
                            <div
                                id="errorMessage"
                                class="alert alert-danger d-none"
                                role="alert"
                            ></div>


                            <!-- Success Message -->
                            <div
                                id="successMessage"
                                class="alert alert-success d-none"
                                role="alert"
                            ></div>


                            <!-- Buttons -->
                            <div class="d-flex justify-content-end gap-2">

                                <a
                                    href="complaints.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                                <button
                                    type="submit"
                                    id="submitButton"
                                    class="btn btn-primary"
                                >
                                    Submit Complaint
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Create Complaint JavaScript -->
    <script src="../js/create-complaint.js"></script>

</body>

</html>
