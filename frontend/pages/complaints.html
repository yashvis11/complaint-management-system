<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaints - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-light bg-white border-bottom">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="dashboard.html">

                📋 ComplaintMS

            </a>


            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">

                    Dashboard

                </a>


                <a href="create-complaint.html" class="btn btn-primary">

                    + New Complaint

                </a>


                <a href="profile.html" class="btn btn-outline-secondary">

                    Profile

                </a>

            </div>

        </div>

    </nav>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="container py-5">


        <!-- Page Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="mb-2">
                    My Complaints
                </h1>

                <p class="text-muted mb-0">
                    View and track your submitted complaints.
                </p>

            </div>


            <a href="create-complaint.html" class="btn btn-primary">

                + New Complaint

            </a>

        </div>



        <!-- ================= COMPLAINT TABLE ================= -->

        <div class="card shadow-sm border-0">

            <div class="card-body">


                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    Title
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Priority
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="complaintsTableBody">

                            <tr>

                                <td colspan="7" class="text-center py-5">

                                    Loading complaints...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </main>



    <script src="../js/complaints.js"></script>


</body>

</html>
