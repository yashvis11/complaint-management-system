<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #complaintRows tr { cursor: pointer; }
        #complaintRows tr.table-active { font-weight: 600; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Admin Panel</h1>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Back to dashboard</a>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <!-- Statistics -->
    <div class="row g-3 mb-4" id="statsRow"></div>

    <div class="row g-4">

        <!-- Complaint list -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Title</th><th>User</th><th>Priority</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="complaintRows">
                            <tr><td colspan="4" class="text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Complaint details -->
        <div class="col-lg-5">
            <div class="card card-body shadow-sm">
                <p id="detailEmpty" class="text-muted mb-0">Select a complaint to review it.</p>

                <div id="detailPanel" class="d-none">
                    <h2 class="h5" id="detailTitle"></h2>
                    <p class="text-muted small mb-2" id="detailMeta"></p>
                    <p id="detailDescription" style="white-space: pre-wrap;"></p>

                    <form id="updateForm">
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" class="form-select">
                                <option>Pending</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                                <option>Rejected</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="priority" class="form-label">Priority</label>
                            <select id="priority" class="form-select">
                                <option>Low</option>
                                <option>Medium</option>
                                <option>High</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="assignedTo" class="form-label">Assigned to</label>
                            <select id="assignedTo" class="form-select"></select>
                        </div>

                        <button type="submit" id="saveButton" class="btn btn-success">Save changes</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
