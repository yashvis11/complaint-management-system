<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - ComplaintMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-light bg-white border-bottom">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-primary" href="admin.html">

                📋 ComplaintMS - Admin

            </a>


            <div class="d-flex gap-2">

                <a href="dashboard.html" class="btn btn-outline-primary">

                    Dashboard

                </a>


                <a href="complaints.html" class="btn btn-outline-secondary">

                    My Complaints

                </a>


                <a href="profile.html" class="btn btn-outline-secondary">

                    Profile

                </a>

            </div>

        </div>

    </nav>



    <!-- ================= MAIN ================= -->

    <main class="container py-5">


        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="mb-2">
                    Admin Panel
                </h1>

                <p class="text-muted mb-0">
                    Manage and update submitted complaints.
                </p>

            </div>

        </div>



        <!-- MESSAGE -->

        <div id="message" class="alert d-none" role="alert">
        </div>



        <!-- ================= STATISTICS ================= -->

        <div class="row g-3 mb-4">


            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Total Complaints
                        </h6>

                        <h2 id="totalCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Pending
                        </h6>

                        <h2 id="pendingCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            In Progress
                        </h6>

                        <h2 id="progressCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Resolved
                        </h6>

                        <h2 id="resolvedCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= COMPLAINTS ================= -->

        <div class="card shadow-sm border-0">

            <div class="card-body">


                <h4 class="mb-4">
                    All Complaints
                </h4>


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    User
                                </th>

                                <th>
                                    Title
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Priority
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="complaintsTableBody">

                            <tr>

                                <td colspan="8" class="text-center py-5">

                                    Loading complaints...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        const API_BASE_URL =
            window.location.origin;


        const tableBody =
            document.getElementById(
                "complaintsTableBody"
            );


        const message =
            document.getElementById("message");



        /* ================= LOAD COMPLAINTS ================= */

        async function loadComplaints() {

            try {


                const response =
                    await fetch(
                        `${API_BASE_URL}/api/admin/complaints`
                    );


                const result =
                    await response.json();


                console.log(
                    "Admin complaints API:",
                    result
                );


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Failed to load complaints"
                    );

                }


                const complaints =
                    result.data;


                updateStatistics(
                    complaints
                );


                if (
                    !complaints ||
                    complaints.length === 0
                ) {

                    tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="text-center text-muted py-5">

                        No complaints found.

                    </td>

                </tr>

            `;

                    return;

                }


                tableBody.innerHTML = "";


                complaints.forEach(
                    complaint => {

                        const row =
                            document.createElement("tr");


                        row.innerHTML = `

                    <td>
                        <strong>
                            #${complaint.id}
                        </strong>
                    </td>


                    <td>

                        <div>
                            ${escapeHtml(
                            complaint.user_name ||
                            "Unknown User"
                        )}
                        </div>

                        <small class="text-muted">

                            ${escapeHtml(
                            complaint.user_email ||
                            ""
                        )}

                        </small>

                    </td>


                    <td>

                        ${escapeHtml(
                            complaint.title
                        )}

                    </td>


                    <td>

                        ${escapeHtml(
                            complaint.category
                        )}

                    </td>


                    <td>

                        <span
                            class="badge ${getPriorityClass(
                            complaint.priority
                        )}">

                            ${escapeHtml(
                            complaint.priority
                        )}

                        </span>

                    </td>


                    <td>

                        <span
                            class="badge ${getStatusClass(
                            complaint.status
                        )}">

                            ${escapeHtml(
                            complaint.status
                        )}

                        </span>

                    </td>


                    <td>

                        ${formatDate(
                            complaint.created_at
                        )}

                    </td>


                    <td>

                        <div class="d-flex gap-2">


                            <a
                                href="complaint-details.html?id=${complaint.id}"
                                class="btn btn-sm btn-outline-primary">

                                View

                            </a>


                            <select
                                class="form-select form-select-sm"
                                style="width: 140px"
                                onchange="updateStatus(
                                    ${complaint.id},
                                    this.value
                                )">

                                <option
                                    value="Pending"
                                    ${complaint.status === "Pending" ? "selected" : ""}>

                                    Pending

                                </option>


                                <option
                                    value="In Progress"
                                    ${complaint.status === "In Progress" ? "selected" : ""}>

                                    In Progress

                                </option>


                                <option
                                    value="Resolved"
                                    ${complaint.status === "Resolved" ? "selected" : ""}>

                                    Resolved

                                </option>


                                <option
                                    value="Rejected"
                                    ${complaint.status === "Rejected" ? "selected" : ""}>

                                    Rejected

                                </option>

                            </select>


                        </div>

                    </td>

                `;


                        tableBody.appendChild(row);

                    }
                );


            } catch (error) {


                console.error(
                    "Error loading admin complaints:",
                    error
                );


                tableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center text-danger py-5">

                    Failed to load complaints.

                </td>

            </tr>

        `;

            }

        }



        /* ================= UPDATE STATUS ================= */

        async function updateStatus(
            complaintId,
            newStatus
        ) {

            try {


                const response =
                    await fetch(
                        `${API_BASE_URL}/api/admin/complaints/${complaintId}/status`,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                status: newStatus

                            })

                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Failed to update status"
                    );

                }


                showMessage(
                    "Complaint status updated successfully.",
                    "success"
                );


                // Reload table
                loadComplaints();


            } catch (error) {


                console.error(
                    "Error updating status:",
                    error
                );


                showMessage(
                    error.message ||
                    "Failed to update status.",
                    "danger"
                );

            }

        }



        /* ================= STATISTICS ================= */

        function updateStatistics(
            complaints
        ) {


            document.getElementById(
                "totalCount"
            ).textContent =
                complaints.length;


            document.getElementById(
                "pendingCount"
            ).textContent =
                complaints.filter(
                    c => c.status === "Pending"
                ).length;


            document.getElementById(
                "progressCount"
            ).textContent =
                complaints.filter(
                    c => c.status === "In Progress"
                ).length;


            document.getElementById(
                "resolvedCount"
            ).textContent =
                complaints.filter(
                    c => c.status === "Resolved"
                ).length;

        }



        /* ================= MESSAGE ================= */

        function showMessage(
            text,
            type
        ) {

            message.className =
                `alert alert-${type}`;

            message.textContent =
                text;


            setTimeout(() => {

                message.className =
                    "alert d-none";

            }, 3000);

        }



        /* ================= PRIORITY ================= */

        function getPriorityClass(
            priority
        ) {

            switch (priority) {

                case "High":
                    return "bg-danger";

                case "Medium":
                    return "bg-warning text-dark";

                case "Low":
                    return "bg-success";

                default:
                    return "bg-secondary";

            }

        }



        /* ================= STATUS ================= */

        function getStatusClass(
            status
        ) {

            switch (status) {

                case "Pending":
                    return "bg-warning text-dark";

                case "In Progress":
                    return "bg-info text-dark";

                case "Resolved":
                    return "bg-success";

                case "Rejected":
                    return "bg-danger";

                default:
                    return "bg-secondary";

            }

        }



        /* ================= DATE ================= */

        function formatDate(
            dateValue
        ) {

            if (!dateValue) {
                return "-";
            }


            const date =
                new Date(dateValue);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "-";

            }


            return date.toLocaleDateString(
                "en-GB"
            );

        }



        /* ================= SECURITY ================= */

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* ================= START ================= */

        loadComplaints();


    </script>


</body>

</html>
