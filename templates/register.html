{% extends 'base.html' %}
{% block title %}Register - ComplaintDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <span class="brand-icon" style="width:52px;height:52px;font-size:1.4rem;"><i class="bi bi-megaphone-fill"></i></span>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-1 text-center">Create Account</h3>
                <p class="text-muted text-center mb-4">Register to submit and track complaints</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required minlength="6">
                        <div class="form-text">At least 6 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
