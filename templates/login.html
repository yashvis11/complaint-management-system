{% extends 'base.html' %}
{% block title %}Login - ComplaintDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <span class="brand-icon" style="width:52px;height:52px;font-size:1.4rem;"><i class="bi bi-megaphone-fill"></i></span>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-1 text-center">Welcome Back</h3>
                <p class="text-muted text-center mb-4">Log in to ComplaintDesk</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" name="email" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
                </p>
                <hr>
                <p class="text-center text-muted small mb-0">
                    Demo admin: <code>admin@example.com</code> / <code>admin123</code>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
